        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_191&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:295,\&quot;name\&quot;:\&quot;Michael Downey\&quot;,\&quot;username\&quot;:\&quot;downey\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.ospo-alliance.org/downey/{size}/69_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-07-24T17:00:00.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003cstrong\\u003eThe European Commission’s \\u003ca href=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor\\\&quot;\\u003eOpen Source Observatory (OSOR)\\u003c/a\\u003e has released two new excellent country intelligence reports on Italy and Spain. Read more to learn about those countries’ efforts promoting the adoption and support of FLOSS:\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003caside class=\\\&quot;onebox allowlistedgeneric\\\&quot; data-onebox-src=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/spain-2025-country-report\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n      \\u003cimg src=\\\&quot;https://forum.ospo-alliance.org/uploads/default/original/1X/249d773a66a2d02c97a8dc5d2d8f10378e738038.png\\\&quot; class=\\\&quot;site-icon\\\&quot; data-dominant-color=\\\&quot;3333CC\\\&quot; width=\\\&quot;32\\\&quot; height=\\\&quot;32\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/spain-2025-country-report\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot; title=\\\&quot;04:39PM - 16 June 2025\\\&quot;\\u003eInteroperable Europe Portal – 16 Jun 25\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;aspect-image\\\&quot; style=\\\&quot;--aspect-ratio:356/500;\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://forum.ospo-alliance.org/uploads/default/optimized/1X/d716e4b7a230abdc7cbe2d831c61519cd5790863_2_690x431.png\\\&quot; class=\\\&quot;thumbnail\\\&quot; data-dominant-color=\\\&quot;1F3A45\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;431\\\&quot;\\u003e\\u003c/div\\u003e\\n\\n\\u003ch3\\u003e\\u003ca href=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/spain-2025-country-report\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003eSpain 2025 Country Report\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n  \\u003cp\\u003eUpdated country report on open source software in Spain\\u003c/p\\u003e\\n\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eThe updated report outlines the evolution of OSS adoption in the Spanish public sector since 2020. The National Agency for Digital Administration, previously known as Secretariat of Digital Administration, is the main actor at national level that ensures the application of Interoperability Framework and addresses the digitalisation of the Spanish public sector. The Technology Transfer Centre (CTT) remains the main reference to access the open source solutions used by the Spanish public sector, at national, regional and local level. One of the key developments in the past year was the update of the Guide on the Publication and Licensing of IT Solutions elaborated by National Agency for Digital Administration. This guide provides a clear explanation on the different types of software licences from ‘strong’ (GPL, Affero) and ‘mixed’ copyleft (EUPL, MPL) to ‘permissive’ licence (Apache, MIT), and instructions to publish and reuse IT solutions in the CTT catalogue. More importantly, the Guide has a dedicated section about managing open source software projects, which focuses on the legal aspects and obligations of public administrations for this type of project.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eSpain benefits from a strong ecosystem of OSS stakeholders, especially in Galicia, Catalonia, Valencia and Basque Country; in these regions there are relevant long standing open source initiatives such as the educational project Lliurex, or the dedicated Free Software Office of Galicia (Oficina de Software Libre da Xunta de Galicia). The majority of regions have adopted legislation that established the principle of technological neutrality that imposes the use and promotion of open source software. Additionally, Spain has a very rich citizens platform ecosystem based on open source software provided by two key organisations: Consul Democracy and Decidim..\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eOverall, Spain has made significant progress in its use of open source software (OSS), despite the absence of a specific national policy to promote its use. The update of national guidelines and the adoption of enabling regional legislation have marked the Spanish public sector’s good progress in promoting open source software.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003chr\\u003e\\n\\u003caside class=\\\&quot;onebox allowlistedgeneric\\\&quot; data-onebox-src=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/italy-2025-country-report\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n      \\u003cimg src=\\\&quot;https://forum.ospo-alliance.org/uploads/default/original/1X/249d773a66a2d02c97a8dc5d2d8f10378e738038.png\\\&quot; class=\\\&quot;site-icon\\\&quot; data-dominant-color=\\\&quot;3333CC\\\&quot; width=\\\&quot;32\\\&quot; height=\\\&quot;32\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/italy-2025-country-report\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot; title=\\\&quot;05:04PM - 20 June 2025\\\&quot;\\u003eInteroperable Europe Portal – 20 Jun 25\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;aspect-image\\\&quot; style=\\\&quot;--aspect-ratio:353/500;\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://forum.ospo-alliance.org/uploads/default/optimized/1X/d716e4b7a230abdc7cbe2d831c61519cd5790863_2_690x431.png\\\&quot; class=\\\&quot;thumbnail\\\&quot; data-dominant-color=\\\&quot;1F3A45\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;431\\\&quot;\\u003e\\u003c/div\\u003e\\n\\n\\u003ch3\\u003e\\u003ca href=\\\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/italy-2025-country-report\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003eItaly 2025 Country Report\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n  \\u003cp\\u003eUpdated country report on open source software in Italy\\u003c/p\\u003e\\n\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eThe updated report outlines the evolution of OSS adoption in the Italian public sector since 2020.  The Department for Digital Transformation , the Agency for Digital Italy (AgID) and state-owned company PagoPA S.p.A. have been the most active actors among policymakers in promoting the use of open source software. Developers Italia remains the main platform to access the open source solutions used by the Italian public sector, at national, regional and local level. This platform has included the OSS search filter. One of the key developments in the past year was the adoption of the ‘Three-Year Plan for Information Technology in Public Administration’ that set three open source related targets: 1) by the end of 2024, at least 100 public administrations should be releasing open source software in Developers Italia and at least 2,600 public administration should reuse open source software solutions in Developers Italia; 2) by the end of 2025, at least 125 public administrations should be releasing open source software in Developers Italia and at least 2,800 public administration should reuse open source software solutions in Developers Italia; 3) by the end of 2026, at least 150 public administrations should be releasing open source software solutions in Developers Italia and at least 3,000 public administration should reuse open source software solutions in Developers Italia. In parallel, Italy has updated their key policies and guidelines to promote OSS in the public sector:  Guidelines on the acquisition and reuse of software for public administrations and the Digital Administration Code.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e*Strategic players like the Competence Centre for Reuse and Open Source (CCROS), Italian Linux Society and  PDP Free Software User Group have complemented government efforts by providing enhanced technical support and fostering community engagement. In terms of relevant OSS initiatives, Italy has implemented Designers Italia, OpenCity Italia and IO app. Designers Italia is the main tool that public administration uses to create their digital services. OpenCity Italia is the new platform that ensures citizens access to Italian cities’ public services. Lastly, IO app allows citizens to manage digital signatures and payments to public sector, receive communications and receive communications. *\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eOverall, Italy has made a huge step forward by including OSS promotion as part of its national policy and has made a significant update process in its use of open source software (OSS). The update of national guidelines and the adoption of the ‘Three-Year Plan for Information Technology in Public Administration’ have marked the Italian public sector’s very good progress in promoting open source software.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:1,\&quot;updated_at\&quot;:\&quot;2025-07-24T17:00:00.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:84,\&quot;reads\&quot;:5,\&quot;readers_count\&quot;:4,\&quot;score\&quot;:511.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:191,\&quot;topic_slug\&quot;:\&quot;new-country-level-reports-on-public-sector-floss-in-spain-italy\&quot;,\&quot;display_username\&quot;:\&quot;Michael Downey\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/spain-2025-country-report\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Spain 2025 Country Report | Interoperable Europe Portal\&quot;,\&quot;clicks\&quot;:5},{\&quot;url\&quot;:\&quot;https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/italy-2025-country-report\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Italy 2025 Country Report | Interoperable Europe Portal\&quot;,\&quot;click <blockquote>
<p><em>The updated report outlines the evolution of OSS adoption in the Spanish public sector since 2020. The National Agency for Digital Administration, previously known as Secretariat of Digital Administration, is the main actor at national level that ensures the application of Interoperability Framework and addresses the digitalisation of the Spanish public sector. The Technology Transfer Centre (CTT) remains the main reference to access the open source solutions used by the Spanish public sector, at national, regional and local level. One of the key developments in the past year was the update of the Guide on the Publication and Licensing of IT Solutions elaborated by National Agency for Digital Administration. This guide provides a clear explanation on the different types of software licences from ‘strong’ (GPL, Affero) and ‘mixed’ copyleft (EUPL, MPL) to ‘permissive’ licence (Apache, MIT), and instructions to publish and reuse IT solutions in the CTT catalogue. More importantly, the Guide has a dedicated section about managing open source software projects, which focuses on the legal aspects and obligations of public administrations for this type of project.</em></p>
<p><em>Spain benefits from a strong ecosystem of OSS stakeholders, especially in Galicia, Catalonia, Valencia and Basque Country; in these regions there are relevant long standing open source initiatives such as the educational project Lliurex, or the dedicated Free Software Office of Galicia (Oficina de Software Libre da Xunta de Galicia). The majority of regions have adopted legislation that established the principle of technological neutrality that imposes the use and promotion of open source software. Additionally, Spain has a very rich citizens platform ecosystem based on open source software provided by two key organisations: Consul Democracy and Decidim..</em></p>
<p><em>Overall, Spain has made significant progress in its use of open source software (OSS), despite the absence of a specific national policy to promote its use. The update of national guidelines and the adoption of enabling regional legislation have marked the Spanish public sector’s good progress in promoting open source software.</em></p>
</blockquote>

    <div class="aspect-image" style="--aspect-ratio:353/500;"><img src="https://forum.ospo-alliance.org/uploads/default/optimized/1X/d716e4b7a230abdc7cbe2d831c61519cd5790863_2_690x431.png" class="thumbnail" data-dominant-color="1F3A45" width="690" height="431"></div>

<h3><a href="https://interoperable-europe.ec.europa.eu/collection/open-source-observatory-osor/news/italy-2025-country-report" target="_blank" rel="noopener">Italy 2025 Country Report</a></h3>

  <p>Updated country report on open source software in Italy</p>


  </article>

  <div class="onebox-metadata">
    
    
  </div>

  <div style="clear: both"></div>
</aside>

<blockquote>
<p><em>The updated report outlines the evolution of OSS adoption in the Italian public sector since 2020.  The Department for Digital Transformation , the Agency for Digital Italy (AgID) and state-owned company PagoPA S.p.A. have been the most active actors among policymakers in promoting the use of open source software. Developers Italia remains the main platform to access the open source solutions used by the Italian public sector, at national, regional and local level. This platform has included the OSS search filter. One of the key developments in the past year was the adoption of the ‘Three-Year Plan for Information Technology in Public Administration’ that set three open source related targets: 1) by the end of 2024, at least 100 public administrations should be releasing open source software in Developers Italia and at least 2,600 public administration should reuse open source software solutions in Developers Italia; 2) by the end of 2025, at least 125 public administrations should be releasing open source software in Developers Italia and at least 2,800 public administration should reuse open source software solutions in Developers Italia; 3) by the end of 2026, at least 150 public administrations should be releasing open source software solutions in Developers Italia and at least 3,000 public administration should reuse open source software solutions in Developers Italia. In parallel, Italy has updated their key policies and guidelines to promote OSS in the public sector:  Guidelines on the acquisition and reuse of software for public administrations and the Digital Administration Code.</em></p>
<p>*Strategic players like the Competence Centre for Reuse and Open Source (CCROS), Italian Linux Society and  PDP Free Software User Group have complemented government efforts by providing enhanced technical support and fostering community engagement. In terms of relevant OSS initiatives, Italy has implemented Designers Italia, OpenCity Italia and IO app. Designers Italia is the main tool that public administration uses to create their digital services. OpenCity Italia is the new platform that ensures citizens access to Italian cities’ public services. Lastly, IO app allows citizens to manage digital signatures and payments to public sector, receive communications and receive communications. *</p>
<p><em>Overall, Italy has made a huge step forward by including OSS promotion as part of its national policy and has made a significant update process in its use of open source software (OSS). The update of national guidelines and the adoption of the ‘Three-Year Plan for Information Technology in Public Administration’ have marked the Italian public sector’s very good progress in promoting open source software.</em></p>
</blockquote>
