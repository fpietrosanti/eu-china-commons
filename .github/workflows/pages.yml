# Builds site/ and deploys it to GitHub Pages. Manual trigger only until launch is approved;
# after launch add `push: branches: [main]` to deploy on every commit.
name: Deploy site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build_funding.js && node tools/build_site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Hong Kong mirror (cn.eu-china-commons.eu) on Alibaba Cloud OSS, region cn-hongkong.
  # Runs only when the repo variable OSS_BUCKET is set and the secrets
  # OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET exist (RAM user limited to that bucket).
  mirror-hk:
    needs: build
    if: ${{ vars.OSS_BUCKET != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build_funding.js && node tools/build_site.js
      - name: Install ossutil
        run: |
          curl -sSfL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -q ossutil.zip && sudo mv ossutil-v1.7.19-linux-amd64/ossutil64 /usr/local/bin/ossutil
      - name: Sync site/ to OSS
        env:
          ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          KEY: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ossutil sync site/ "oss://${{ vars.OSS_BUCKET }}/" --delete -f \
            -e oss-cn-hongkong.aliyuncs.com -i "$ID" -k "$KEY"
